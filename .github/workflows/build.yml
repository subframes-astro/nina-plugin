name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NINA SDK
        id: cache-nina-sdk
        uses: actions/cache@v4
        with:
          path: nina-sdk
          key: nina-sdk-3.1.2.9001

      - name: Download NINA SDK from NuGet
        if: steps.cache-nina-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ninaVersion = "3.1.2.9001"
          $packages = @(
            "nina.core",
            "nina.plugin",
            "nina.equipment",
            "nina.sequencer",
            "nina.astrometry",
            "nina.wpf.base",
            "nina.profile"
          )
          New-Item -ItemType Directory -Force -Path nina-sdk | Out-Null
          foreach ($pkg in $packages) {
            $url = "https://api.nuget.org/v3-flatcontainer/$pkg/$ninaVersion/$pkg.$ninaVersion.nupkg"
            $outFile = "$pkg.zip"
            Write-Host "Downloading $pkg $ninaVersion..."
            Invoke-WebRequest -Uri $url -OutFile $outFile
            Expand-Archive -Path $outFile -DestinationPath "$pkg-extracted"
            $dll = Get-ChildItem -Path "$pkg-extracted\lib" -Recurse -Filter "*.dll" | Select-Object -First 1
            if ($dll) {
              Copy-Item $dll.FullName -Destination nina-sdk\
              Write-Host "Extracted $($dll.Name)"
            } else {
              Write-Error "Required DLL not found in NuGet package: $pkg"
              exit 1
            }
          }

      - name: Restore dependencies
        env:
          NINA_SDK_PATH: ${{ github.workspace }}\nina-sdk
        run: dotnet restore SubframesPlugin/SubframesPlugin.csproj

      - name: Build
        env:
          NINA_SDK_PATH: ${{ github.workspace }}\nina-sdk
        run: dotnet build SubframesPlugin/SubframesPlugin.csproj -c Release --no-restore

      - name: Run tests
        env:
          NINA_SDK_PATH: ${{ github.workspace }}\nina-sdk
        run: dotnet test SubframesPlugin.Tests/SubframesPlugin.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Collect release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $outDir = "release"
          New-Item -ItemType Directory -Force -Path $outDir
          Copy-Item "SubframesPlugin/bin/Release/net8.0-windows/Subframes.NinaPlugin.dll" $outDir/
          # Include any transitive dependency DLLs that NINA doesn't already ship
          $exclude = @("NINA.*.dll")
          Get-ChildItem "SubframesPlugin/bin/Release/net8.0-windows/*.dll" |
            Where-Object { $_.Name -ne "Subframes.NinaPlugin.dll" } |
            Where-Object { $n = $_.Name; -not ($exclude | Where-Object { $n -like $_ }) } |
            Copy-Item -Destination $outDir/

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: SubframesPlugin
          path: release/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: SubframesPlugin
          path: release/

      - name: Create zip
        run: cd release && zip -r ../SubframesPlugin-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SubframesPlugin-${{ github.ref_name }}.zip
          generate_release_notes: true
